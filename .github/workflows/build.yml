name: Build Plugins

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "README.txt"
      - "merge_log.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout builds branch
        id: checkout-builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
        continue-on-error: true

      - name: Init builds branch if missing
        if: steps.checkout-builds.outcome == 'failure'
        run: |
          mkdir -p builds
          cd builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          echo "# builds" > README.md
          git add README.md
          git commit -m "Init builds branch"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          TMDB_API: ${{ secrets.TMDB_API }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          DUMP_API: ${{ secrets.DUMP_API }}
          DUMP_KEY: ${{ secrets.DUMP_KEY }}
          ZSHOW_API: ${{ secrets.ZSHOW_API }}
          ANICHI_API: ${{ secrets.ANICHI_API }}
          KissKh: ${{ secrets.KissKh }}
          KisskhSub: ${{ secrets.KisskhSub }}
          SUPERSTREAM_THIRD_API: ${{ secrets.SUPERSTREAM_THIRD_API }}
          SUPERSTREAM_FOURTH_API: ${{ secrets.SUPERSTREAM_FOURTH_API }}
          SUPERSTREAM_FIRST_API: ${{ secrets.SUPERSTREAM_FIRST_API }}
          PROXYAPI: ${{ secrets.PROXYAPI }}
          KAISVA: ${{ secrets.KAISVA }}
          MOVIEBOX_SECRET_KEY_ALT: ${{ secrets.MOVIEBOX_SECRET_KEY_ALT }}
          MOVIEBOX_SECRET_KEY_DEFAULT: ${{ secrets.MOVIEBOX_SECRET_KEY_DEFAULT }}
          KAIMEG: ${{ secrets.KAIMEG }}
          KAIDEC: ${{ secrets.KAIDEC }}
          KAIENC: ${{ secrets.KAIENC }}
          VideasyDEC: ${{ secrets.VideasyDEC }}
          YFXENC: ${{ secrets.YFXENC }}
          YFXDEC: ${{ secrets.YFXDEC }}
          NuvFeb: ${{ secrets.NuvFeb }}
          ANICHI_APP: ${{ secrets.ANICHI_APP }}
          SIMKL_API: ${{ secrets.SIMKL_API }}
          MAL_API: ${{ secrets.MAL_API }}
        run: |
          cd src
          python write_local_properties.py

      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DUBBINDO_USERNAME: ${{ secrets.DUBBINDO_USERNAME }}
          DUBBINDO_PASSWORD: ${{ secrets.DUBBINDO_PASSWORD }}
        run: |
          cd src
          chmod +x gradlew
          python build_plugins.py "$GITHUB_WORKSPACE/builds"

      - name: Push builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -m "Build ${{ github.sha }} (run ${{ github.run_number }})" || exit 0
          git push origin HEAD:builds --force
